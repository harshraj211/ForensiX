[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "forensix-forensic"
version = "1.0.0"
description = "Controlled Android forensic transport and acquisition primitives for ForensiX"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7,<0.8",
  "pillow>=12.0,<13",
  "pydantic>=2.12,<3",
  "androguard>=4.0,<5"
]

[tool.setuptools.packages.find]
where = ["src"]
