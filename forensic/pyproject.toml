[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "forensix-forensic"
version = "0.1.0"
description = "Controlled Android forensic transport and acquisition primitives for ForensiX"
requires-python = ">=3.12"
dependencies = [
  "pillow>=12.0,<13",
  "pydantic>=2.12,<3"
]

[tool.setuptools.packages.find]
where = ["src"]
