name: Portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-release.txt
      - name: Install official scrcpy runtime
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\install-scrcpy.ps1 -Version 4.1 -Destination tools\scrcpy
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - run: python scripts/build-release.py --version "$VERSION" --output-dir release
        shell: bash
        env:
          FORENSIX_WINDOWS_SIGN_CERT_B64: ${{ matrix.os == 'windows-latest' && secrets.FORENSIX_WINDOWS_SIGN_CERT_B64 || '' }}
          FORENSIX_WINDOWS_SIGN_CERT_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.FORENSIX_WINDOWS_SIGN_CERT_PASSWORD || '' }}
          FORENSIX_WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.FORENSIX_WINDOWS_SIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
      - name: Resolve attestation files
        id: release-files
        shell: bash
        run: |
          archive="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          sbom="$(find release -maxdepth 1 -type f -name '*.cdx.json' -print -quit)"
          test -n "$archive"
          test -n "$sbom"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release-files.outputs.archive }}
          sbom-path: ${{ steps.release-files.outputs.sbom }}
      - uses: actions/upload-artifact@v4
        with:
          name: forensix-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*.cdx.json
          if-no-files-found: error

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forensix-*
          path: release-assets
          merge-multiple: true
      - name: Normalize release downloads
        shell: bash
        run: |
          mkdir normalized
          for platform in windows linux macos; do
            archive="$(find release-assets -maxdepth 1 -type f -iname "*${platform}-*.zip" | head -n 1)"
            test -n "$archive"
            case "$platform" in
              windows) name="ForensiX-Windows-Portable.zip" ;;
              linux) name="ForensiX-Linux-Portable.zip" ;;
              macos) name="ForensiX-macOS-Portable.zip" ;;
            esac
            cp "$archive" "normalized/$name"
          done
          sha256sum normalized/*.zip > normalized/SHA256SUMS.txt
          find release-assets -maxdepth 1 -type f -delete
          cp normalized/* release-assets/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(release-assets/*.zip release-assets/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "ForensiX ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
