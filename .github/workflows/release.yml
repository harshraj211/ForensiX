name: Portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-release.txt
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - run: python scripts/build-release.py --version "$VERSION" --output-dir release
        shell: bash
      - uses: actions/attest@v4
        with:
          subject-path: "release/*.zip"
          sbom-path: "release/*.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: forensix-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*.cdx.json
          if-no-files-found: error

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forensix-*
          path: release-assets
          merge-multiple: true
      - name: Add stable Windows download name
        shell: bash
        run: |
          windows_archive="$(find release-assets -maxdepth 1 -type f -iname '*windows-*.zip' | head -n 1)"
          test -n "$windows_archive"
          cp "$windows_archive" release-assets/ForensiX-Windows-Portable.zip
          sha256sum release-assets/ForensiX-Windows-Portable.zip > release-assets/ForensiX-Windows-Portable.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "ForensiX ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
